<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="田んぼの地図・作業予定・作業記録・農薬チェックをまとめて管理する営農記録アプリ">
  <meta name="theme-color" content="#2f6f3e">
  <title>田んぼノート</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="app">
    <header class="topbar no-print">
      <a class="brand" href="#/today"><img src="icon.svg" alt="" width="28" height="28"><span id="farmName">田んぼノート</span></a>
      <span id="meBadge" class="me-badge"></span>
    </header>

    <nav class="nav no-print" aria-label="メニュー">
      <a href="#/today" data-route="today"><span class="nav-ico" aria-hidden="true">☀</span><span>今日</span></a>
      <a href="#/map" data-route="map"><span class="nav-ico" aria-hidden="true">▦</span><span>地図</span></a>
      <a href="#/plan" data-route="plan"><span class="nav-ico" aria-hidden="true">☰</span><span>予定・記録</span></a>
      <a href="#/summary" data-route="summary"><span class="nav-ico" aria-hidden="true">∑</span><span>集計</span></a>
      <a href="#/settings" data-route="settings"><span class="nav-ico" aria-hidden="true">⚙</span><span>設定</span></a>
    </nav>

    <main class="main">
      <section id="view" class="view"></section>
      <section id="mapPage" class="map-page" hidden>
        <div id="map" class="map"></div>
        <aside id="mapSide" class="map-side"></aside>
      </section>
    </main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
